<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Manual de uso · KimünKo — ONG Alumco</title>
<style>
  :root{ --navy:#13224d; --azul:#2B4FA0; --ambar:#F5A623; --ink:#1d2233; --muted:#5b6173; --line:#e4e8f0; --soft:#f4f6fb; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .page{ width:210mm; min-height:297mm; padding:18mm 17mm 16mm; page-break-after:always; position:relative; display:flex; flex-direction:column; }
  .page:last-child{page-break-after:auto}

  /* ---- COVER ---- */
  .cover{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#13224d, #21346e 70%, #2B4FA0);color:#fff}
  .cover .drop{font-size:64px;line-height:1;margin-bottom:10px}
  .cover h1{font-size:46px;font-weight:800;letter-spacing:-1px}
  .cover h1 b{color:var(--ambar)}
  .cover .tag{font-size:16px;letter-spacing:.32em;text-transform:uppercase;color:#a9b6dd;margin:18px 0 26px}
  .cover .sub{font-size:18px;color:#dfe6f7;max-width:120mm;line-height:1.6}
  .cover .meta{margin-top:46px;font-size:13.5px;color:#9fb0da;line-height:1.9}
  .cover .chip{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:30px;padding:7px 18px;color:#fff;font-size:13px;margin-top:8px}

  /* ---- SECTION DIVIDER ---- */
  .divider{justify-content:center}
  .divider .kicker{font-size:14px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--azul)}
  .divider h2{font-size:40px;font-weight:800;letter-spacing:-.6px;margin:10px 0 16px;color:var(--navy)}
  .divider p{font-size:17px;color:var(--muted);max-width:140mm;line-height:1.65}
  .divider .rule{width:60px;height:6px;border-radius:6px;background:var(--ambar);margin-top:24px}
  .divider .num{position:absolute;right:17mm;bottom:16mm;font-size:140px;font-weight:800;color:var(--soft)}

  /* ---- STEP PAGE ---- */
  .step .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .step .badge{background:var(--ambar);color:var(--navy);font-weight:800;font-size:13px;border-radius:30px;padding:5px 14px;white-space:nowrap}
  .step .part{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .step h3{font-size:27px;font-weight:800;letter-spacing:-.4px;color:var(--navy);margin-bottom:14px;line-height:1.15}
  .shot{width:100%;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 26px -16px rgba(19,34,77,.4);overflow:hidden;background:#0e1a3d}
  .shot img{display:block;width:100%;height:auto;max-height:128mm;object-fit:contain;background:#fff}
  .info{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .what{font-size:15.5px;color:var(--ink);line-height:1.55}
  .what b{color:var(--navy)}
  .dos{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .dos h4{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--azul);margin-bottom:8px}
  .dos ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .dos li{font-size:14px;color:var(--ink);line-height:1.45;padding-left:22px;position:relative}
  .dos li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;border-radius:3px;background:var(--ambar)}
  .dos li .b{font-weight:700;color:var(--navy)}
  .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .foot b{color:var(--navy)}
  .foot b span{color:var(--ambar)}

  @page{ size:A4; margin:0; }
</style>
</head>
<body>
<div id="doc"></div>

const doc = document.getElementById('doc');
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

// cover
doc.appendChild(el(`<section class="page cover">
  <div class="drop">💧</div>
  <h1>Kimün<b>Ko</b></h1>

  <div><span class="chip">${S.length} pantallas · 3 partes</span></div>
</section>`));

let n = 0;
let partNumber = 0;

  partNumber++;
  const P = PARTS[area];
  doc.appendChild(el(`<section class="page divider">
    <div class="kicker">${P.part}</div>
    <h2>${P.title}</h2>
    <p>${P.desc}</p>
    <div class="rule"></div>
    <div class="num">${partNumber}</div>
  </section>`));

    n++;
    const [ar,file,title,what,dos]=s;
    const src='capturas/'+ar+'/'+file+'.png';
    const lis = dos.map(d=>`<li>${d}</li>`).join('');
    doc.appendChild(el(`<section class="page step">
      <div class="top"><span class="badge">Paso ${n}</span><span class="part">${P.part}</span></div>
      <h3>${title}</h3>

</html>
