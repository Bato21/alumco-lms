<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>KimünKo — video demo</title>
<style>
  html, body { margin: 0; background: #FAF6ED; }
  /* Suelo opaco del escenario. Es requisito de render, no estilo: sin él, la
     ventana de una costura deja pasar blanco a través del hueco de opacidad. */
  #root { background: #FAF6ED; }
</style>
</head>
<body>

<div data-hf-id="hf-dy4d" id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="90">

  <!-- Sin <audio>: la entrega es muda por decisión del brief (music_strategy: none,
       sin voz en el pipeline). La música y la locución se montan después, fuera. -->

  <!-- Ventanas de los cargadores, según el TIPO de límite:
         · corte (fila del ledger)  → instantáneo: el saliente termina EN el corte
           y el entrante arranca exactamente ahí. Nunca antes.
         · disolución (sin fila)    → los dos conviven: el saliente sigue vivo D
           segundos más allá de su fin nominal.
       D = 0.7s (transition_speed: medium).

       Estado inicial: UN solo dueño por escena. Las que aparecen en ledger.json
       reciben su base del sello (sin style inline); las que solo se alcanzan por
       disolución llevan su propio opacity:0. Declararlo dos veces es como una
       escena acaba invisible para siempre con todas las puertas en verde. -->

  <!-- 1 · El papeleo — 0 → 10. Sale por corte. -->
  <div data-hf-id="hf-krit" id="ld-00" data-composition-id="scene-00-papeleo" data-composition-src="scenes/00-papeleo.html" data-start="0" data-duration="10" data-track-index="1"></div>

  <!-- 2 · La plataforma — 10 → 20. Entra y sale por corte. -->
  <div data-hf-id="hf-lr1g" id="ld-01" data-composition-id="scene-01-plataforma" data-composition-src="scenes/01-plataforma.html" data-start="10" data-duration="10" data-track-index="2"></div>

  <!-- 3 · La jornada de Camila — 20 → 38, +0.7 de disolución hacia el cuadro 4.
       El <video> interior lleva data-duration="18.7": la ventana COMPLETA de este
       cargador. Si terminara en los 18s nominales, el runtime lo ocultaría durante
       la disolución y el cuadro saliente quedaría en blanco. -->
  <div data-hf-id="hf-h54o" id="ld-02" data-composition-id="scene-02-camila" data-composition-src="scenes/02-camila.html" data-start="20" data-duration="18.7" data-track-index="3"></div>

  <!-- 4 · El evento — 38 → 54, +0.7. Entra y sale por disolución: no está en el
       ledger, así que es dueña de su propio estado inicial. -->
  <div data-hf-id="hf-fhek" id="ld-03" data-composition-id="scene-03-evento" data-composition-src="scenes/03-evento.html" data-start="38" data-duration="16.7" data-track-index="4" style="opacity:0"></div>

  <!-- 5 · Del computador al bolsillo — 54 → 70. Entra por disolución, sale por corte. -->
  <div data-hf-id="hf-6elq" id="ld-04" data-composition-id="scene-04-dos-dispositivos" data-composition-src="scenes/04-dos-dispositivos.html" data-start="54" data-duration="16" data-track-index="5"></div>

  <!-- 6 · El folio verificable — 70 → 84. Entra y sale por corte. -->
  <div data-hf-id="hf-wiem" id="ld-05" data-composition-id="scene-05-certificado" data-composition-src="scenes/05-certificado.html" data-start="70" data-duration="14" data-track-index="6"></div>

  <!-- 7 · Placa final — 84 → 90. No hay límite después: es la única que anima su salida. -->
  <div data-hf-id="hf-3u2y" id="ld-06" data-composition-id="scene-06-cierre" data-composition-src="scenes/06-cierre.html" data-start="84" data-duration="6" data-track-index="7"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#ld-00", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#ld-04"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#ld-01", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#ld-02", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#ld-05", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#ld-06", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — papeleo→plataforma : inverse zoom-through (cut @10)
      tl.to("#ld-00", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 9.79);
      tl.to("#ld-00", { autoAlpha: 0, duration: 0.21, ease: "none" }, 9.79);
      tl.set("#ld-00", { autoAlpha: 0 }, 10);
      tl.fromTo("#ld-01", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 10);
      
      // SEAM — plataforma→camila : inverse zoom-through (cut @20)
      tl.to("#ld-01", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 19.79);
      tl.to("#ld-01", { autoAlpha: 0, duration: 0.21, ease: "none" }, 19.79);
      tl.set("#ld-01", { autoAlpha: 0 }, 20);
      tl.fromTo("#ld-02", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 20);
      
      // SEAM — dispositivos→certificado : inverse zoom-through (cut @70)
      tl.to("#ld-04", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 69.79);
      tl.to("#ld-04", { autoAlpha: 0, duration: 0.21, ease: "none" }, 69.79);
      tl.set("#ld-04", { autoAlpha: 0 }, 70);
      tl.fromTo("#ld-05", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 70);
      
      // SEAM — certificado→cierre : inverse zoom-through (cut @84)
      tl.to("#ld-05", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 83.79);
      tl.to("#ld-05", { autoAlpha: 0, duration: 0.21, ease: "none" }, 83.79);
      tl.set("#ld-05", { autoAlpha: 0 }, 84);
      tl.fromTo("#ld-06", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 84);
      
      // </seams:auto>

  // ── Hand-authored, BELOW the markers so un re-sellado no lo pise ──────────────
  // Los dos límites por disolución (38s y 54s) no son filas del ledger: una
  // disolución no puede serlo (no tiene solapamiento cero ni portador), así que
  // el verificador no las mide. Van a mano.
  const D = 0.7;

  // OJO: se usa autoAlpha, no opacity. El sello fija la base de las escenas del
  // ledger con `autoAlpha: 0`, que es visibility:hidden MÁS opacity:0. Un tween que
  // solo tocara `opacity` dejaría el visibility en hidden y la escena no aparecería
  // nunca — invisible con lint, check y seam gate en verde. autoAlpha gestiona las
  // dos propiedades a la vez, así que un solo dueño por escena.

  // 38s · Camila → evento
  tl.to("#ld-02", { autoAlpha: 0, duration: D, ease: "power1.inOut" }, 38);
  tl.fromTo("#ld-03", { autoAlpha: 0 },
    { autoAlpha: 1, duration: D, ease: "power1.inOut", immediateRender: false }, 38);

  // 54s · evento → dos dispositivos
  tl.to("#ld-03", { autoAlpha: 0, duration: D, ease: "power1.inOut" }, 54);
  tl.fromTo("#ld-04", { autoAlpha: 0 },
    { autoAlpha: 1, duration: D, ease: "power1.inOut", immediateRender: false }, 54);

  window.__timelines["main"] = tl;
</script>

</body>
</html>
