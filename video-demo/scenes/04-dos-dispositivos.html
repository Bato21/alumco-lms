<!-- Cuadro 5 — «Del computador al bolsillo» · 16s
     Escena compuesta con DOS capturas reales de la misma plataforma:
       · fondo  → public/screenshots/scene-04-escritorio-evento.png (vista de la
                  administradora, fotograma real del clip del cuadro 4)
       · frente → public/screenshots/scene-04-movil-tarea.png (PWA a 390×844, la
                  MISMA tarea, vista por Camila)
     camera: rack-focus · motion: `depth-of-field-blur`, `viewport-change`.
     El foco viaja de un plano al otro sin que la cámara se mueva. Ese salto ES el
     argumento del beat: un corte diría «otra escena», el rack-focus dice «el mismo
     momento, el mismo sitio».

     Marco de teléfono construido a mano en vez del componente `device-frame-stage`:
     ese componente aporta una entrada escénica y una flotación en reposo, y este
     contrato de diseño prohíbe el movimiento en vacío. Lo que se necesita aquí es
     un bisel y nada más.

     La píldora de aviso es cromo de marca (motion graphic), no una captura de UI:
     va con la tipografía del video, no imitando el aviso del sistema operativo. Su
     texto sale de la tarea real visible en las dos capturas. -->
<template id="scene-04-dos-dispositivos-template">
  <div data-composition-id="scene-04-dos-dispositivos" data-width="1920" data-height="1080">

    <div class="dd-desk" data-layout-allow-overflow>
      <div class="dd-browser" data-layout-allow-overflow>
        <div class="dd-bar">
          <span class="dd-dot dd-r"></span><span class="dd-dot dd-y"></span><span class="dd-dot dd-g"></span>
        </div>
        <img class="dd-deskimg" src="public/screenshots/scene-04-escritorio-evento.png" alt="">
      </div>
    </div>

    <div class="dd-phone">
      <div class="dd-bezel">
        <img class="dd-phoneimg" src="public/screenshots/scene-04-movil-tarea.png" alt="">
      </div>
      <div class="dd-toast">
        <span class="dd-toast-app">KimünKo</span>
        <span class="dd-toast-msg">Nueva tarea asignada</span>
      </div>
    </div>

    <div class="dd-vignette"></div>

    <style>
      [data-composition-id="scene-04-dos-dispositivos"]{position:absolute;inset:0;overflow:hidden;
        background:radial-gradient(120% 120% at 42% 0%,#FFFDF6 0%,#FAF6ED 100%);
        font-family:"Geist",system-ui,sans-serif}

      /* Plano de fondo: el escritorio, desplazado a la izquierda para dejar sitio al teléfono */
      [data-composition-id="scene-04-dos-dispositivos"] .dd-desk{position:absolute;z-index:1;
        left:-3%;top:50%;width:76%;transform:translateY(-50%);transform-origin:50% 50%}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-browser{border-radius:14px;
        overflow:hidden;background:#FFFDF6;visibility:hidden;opacity:0;
        box-shadow:0 0 0 1px rgba(17,23,40,.06),9px 40px 90px rgba(17,23,40,.16)}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-bar{display:flex;align-items:center;
        gap:9px;padding:13px 17px;background:#F4F1EA;border-bottom:1px solid #E3E2E0}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-dot{width:12px;height:12px;border-radius:50%}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-r{background:#BB3A2E}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-y{background:#D3A467}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-g{background:#1C5C40}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-deskimg{display:block;width:100%;height:auto}

      /* Plano frontal: el teléfono, a la derecha y más cerca de cámara */
      [data-composition-id="scene-04-dos-dispositivos"] .dd-phone{position:absolute;z-index:2;
        right:6%;top:50%;width:23%;transform:translateY(-50%);transform-origin:50% 50%}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-bezel{border-radius:44px;
        padding:13px;background:#111728;visibility:hidden;opacity:0;
        box-shadow:0 0 0 1px rgba(17,23,40,.20),18px 60px 120px rgba(17,23,40,.34)}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-phoneimg{display:block;width:100%;
        height:auto;border-radius:32px}

      /* Aviso: cromo de marca, tinta oscura sobre ámbar (nunca blanco sobre ámbar) */
      [data-composition-id="scene-04-dos-dispositivos"] .dd-toast{position:absolute;
        left:-14%;top:7%;width:106%;display:flex;flex-direction:column;gap:6px;
        padding:20px 24px;border-radius:18px;background:#F5A623;color:#111728;
        visibility:hidden;opacity:0;
        box-shadow:0 18px 44px rgba(17,23,40,.26)}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-toast-app{
        font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:22px;
        letter-spacing:.12em;text-transform:uppercase}
      [data-composition-id="scene-04-dos-dispositivos"] .dd-toast-msg{font-size:30px;
        font-weight:500;line-height:1.15}

      [data-composition-id="scene-04-dos-dispositivos"] .dd-vignette{position:absolute;inset:0;z-index:0;
        pointer-events:none;
        background:radial-gradient(125% 115% at 50% 50%,rgba(250,246,237,0) 55%,rgba(250,246,237,.78) 100%)}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      (function () {
        var ROOT = '[data-composition-id="scene-04-dos-dispositivos"]';
        var tl = gsap.timeline({ paused: true });

        var DESK  = ROOT + ' .dd-browser';
        var PHONE = ROOT + ' .dd-bezel';
        var TOAST = ROOT + ' .dd-toast';

        /* Estado de apertura: escritorio nítido, teléfono ya presente pero fuera de foco.
           Los dos existen desde el primer fotograma — es el mismo sitio, no dos escenas. */
        tl.fromTo(DESK,
          { autoAlpha: 0, filter: 'blur(0px)' },
          { autoAlpha: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, 0.1);
        tl.fromTo(PHONE,
          { autoAlpha: 0, filter: 'blur(11px)', scale: 0.985 },
          { autoAlpha: 1, filter: 'blur(11px)', scale: 0.985, duration: 0.7, ease: 'power2.out' }, 0.35);

        /* EL SALTO DE FOCO — el argumento del beat. Los dos planos cruzan a la vez:
           el escritorio se va a desenfoque mientras el teléfono resuelve. */
        var SALTO = 7.4;
        tl.to(DESK,  { filter: 'blur(9px)',  duration: 1.15, ease: 'power2.inOut' }, SALTO);
        tl.to(PHONE, { filter: 'blur(0px)', scale: 1, duration: 1.15, ease: 'power2.inOut' }, SALTO);

        /* El aviso llega justo cuando el foco termina de resolver: es lo que MOTIVA el salto. */
        tl.fromTo(TOAST,
          { autoAlpha: 0, y: -26 },
          { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, SALTO + 0.75);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene-04-dos-dispositivos'] = tl;
      })();
    </script>
  </div>
</template>
